name: Keep Streamlit App Awake

on:
  schedule:
    - cron: "0 */6 * * *" # Runs every 6 hours
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  wake-app:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Ping and Wake Streamlit App
        run: |
          python - << 'EOF'
          from playwright.sync_api import sync_playwright

          APP_URL = "https://ai-meeting-intelligence-agent.streamlit.app/"

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto(APP_URL, timeout=60000)
              page.wait_for_timeout(5000)

              # Click the wake button if the app went to sleep
              wake_btn = page.locator("button:has-text('Yes, get this app back up!')")
              if wake_btn.count() > 0:
                  wake_btn.click()
                  print("Clicked wake button, waiting for container...")

              # Wait until the main Streamlit UI finishes rendering
              page.wait_for_selector("div[data-testid='stAppViewContainer']", timeout=90000)
              print("Streamlit app is awake and rendered!")
              browser.close()
          EOF
